name: Verify Paper 1.18.2 / Java 17
on:
  push:
    branches: ['compat/1.18.2']
  pull_request:
    branches: ['compat/1.18.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  legacy-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build Java 17 plugin on Paper 1.18.2 API
        run: gradle clean test build --stacktrace
      - name: Check 1.18.2 archive and plugin descriptor
        run: |
          JAR=$(find build/libs -maxdepth 1 -name '*_1.18.2.jar' -type f | head -n 1)
          test -n "$JAR"
          test -s "$JAR"
          unzip -p "$JAR" plugin.yml | grep -Eq "api-version: ['\"]?1.18['\"]?"
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-paper-1.18.2-unverified-runtime
          path: build/libs/*_1.18.2.jar
          if-no-files-found: error
