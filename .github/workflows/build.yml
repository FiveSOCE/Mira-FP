name: Build and Publish Mira-FP 1.18.2
on:
  push:
    branches: ['compat/1.18.2']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Compile
        run: gradle clean build --no-daemon
      - name: Validate plugin JAR
        shell: bash
        run: |
          set -euo pipefail
          JAR=build/libs/Mira-FP-1.18.2-0.1.0-dev.jar
          test -s "$JAR"
          jar tf "$JAR" | grep -Fx plugin.yml
          jar tf "$JAR" | grep -Fx com/fivesoce/mira/fp/MiraFP.class
          javap -verbose -classpath "$JAR" com.fivesoce.mira.fp.MiraFP | grep -F 'major version: 61'
      - uses: actions/upload-artifact@v4
        with:
          name: Mira-FP-1.18.2
          path: build/libs/Mira-FP-1.18.2-0.1.0-dev.jar
          if-no-files-found: error
      - name: Publish development JAR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dev-1.18.2 >/dev/null 2>&1 || gh release create dev-1.18.2 --prerelease --title 'Mira-FP 1.18.2 development' --notes 'Paper 1.18.2 / Java 17 compatibility preview. Armor stand stand-ins, not full player-shaped or tab-list fake players.' --target "$GITHUB_SHA"
          gh release upload dev-1.18.2 build/libs/Mira-FP-1.18.2-0.1.0-dev.jar --clobber
